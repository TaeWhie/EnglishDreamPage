<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Dream Dashboard</title>
    <style>
        :root {
            --bg: #eef3f7;
            --panel: #ffffff;
            --line: #dbe6ee;
            --text: #17212b;
            --muted: #758391;
            --blue: #2f80ed;
            --red: #e54b4b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(440px, calc(100vw - 36px));
            padding: 34px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: 0 20px 60px rgba(22, 42, 61, 0.12);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.55rem;
            letter-spacing: 0;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.55;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 800;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 16px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }

        .hint {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .error {
            min-height: 20px;
            margin-top: 10px;
            color: var(--red);
            font-size: 0.92rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>English Dream Dashboard</h1>
        <p id="intro">처음 실행하는 경우 대시보드 비밀번호를 설정하세요.</p>
        <form id="lockForm">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" minlength="6" required autofocus>
            <button id="submitButton" type="submit">대시보드 열기</button>
            <div class="error" id="error" role="alert"></div>
        </form>
        <div class="hint">비밀번호는 이 PC의 앱 저장소에만 보관됩니다. 잊어버린 경우 앱 데이터 초기화가 필요합니다.</div>
    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const intro = document.getElementById('intro');
        const submitButton = document.getElementById('submitButton');
        const error = document.getElementById('error');
        const storedHash = localStorage.getItem('ed-dashboard-password-hash');

        if (storedHash) {
            intro.textContent = '대시보드 비밀번호를 입력하세요.';
        } else {
            submitButton.textContent = '비밀번호 설정 후 열기';
        }

        async function hashPassword(value) {
            const bytes = new TextEncoder().encode(value);
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return Array.from(new Uint8Array(digest))
                .map((byte) => byte.toString(16).padStart(2, '0'))
                .join('');
        }

        function openDashboard() {
            window.location.href = window.EnglishDreamDesktop.dashboardPath;
        }

        document.getElementById('lockForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            error.textContent = '';

            const password = passwordInput.value;
            if (password.length < 6) {
                error.textContent = '비밀번호는 6자 이상으로 설정하세요.';
                return;
            }

            const nextHash = await hashPassword(password);
            const currentHash = localStorage.getItem('ed-dashboard-password-hash');

            if (!currentHash) {
                localStorage.setItem('ed-dashboard-password-hash', nextHash);
                openDashboard();
                return;
            }

            if (nextHash !== currentHash) {
                error.textContent = '비밀번호가 올바르지 않습니다.';
                passwordInput.select();
                return;
            }

            openDashboard();
        });
    </script>
</body>
</html>
